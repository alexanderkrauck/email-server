name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.14.14

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The suite is self-contained: in-memory SQLite, a temporary data
      # directory, and no network. It must stay that way.
      - run: pytest -q

  migrations:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emailserver
          POSTGRES_USER: emailserver
          POSTGRES_PASSWORD: emailserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emailserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EMAILSERVER_DATABASE_URL: postgresql://emailserver:emailserver@localhost:5432/emailserver
      EMAILSERVER_DATA_DIR: /tmp/emailserver-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt
      - run: mkdir -p "$EMAILSERVER_DATA_DIR"

      # Stop before the backfill so rows can be seeded into the pre-migration
      # shape; an empty database would short-circuit it and prove nothing.
      - name: Apply migrations up to the placements table
        run: |
          python - <<'PY'
          from pathlib import Path

          from alembic import command
          from alembic.config import Config

          from src.config import settings

          config = Config("alembic.ini")
          config.set_main_option("script_location", str(Path("alembic").resolve()))
          config.set_main_option("sqlalchemy.url", settings.database_url.replace("%", "%%"))
          command.upgrade(config, "20260731_09")
          PY

      # Seed the exact shape the backfill exists for: one message filed in two
      # folders, which the old identity scheme stored as two unrelated rows.
      - name: Seed rows so the backfill path is exercised
        run: |
          python - <<'PY'
          from src.database.connection import SessionLocal
          from src.models.email import EmailLog
          from src.models.smtp_config import SMTPConfig
          from src.models.user import User

          with SessionLocal() as db:
              db.add(User(google_sub="ci", email="ci@example.invalid"))
              db.flush()
              account = SMTPConfig(
                  owner_user_id=1, provider="imap", auth_type="password", name="ci",
                  account_name="ci@example.invalid", host="imap.example.invalid", port=993,
                  smtp_host="smtp.example.invalid", smtp_port=465, username="ci",
              )
              db.add(account)
              db.flush()
              for folder, uid in (("INBOX", 1), ("INBOX.Sent", 2)):
                  db.add(EmailLog(
                      smtp_config_id=account.id, sender="a@example.invalid",
                      recipient="b@example.invalid", subject="ci",
                      message_id="<ci@example.invalid>",
                      provider_message_id=f"{folder}:1:{uid}",
                      folder=folder, imap_uid=uid, uid_validity=1,
                  ))
              db.commit()
          PY

      # Exercise the same entry point the server uses on startup, so a broken
      # revision fails here rather than on a production deployment.
      - name: Apply the backfill
        run: python -c "from src.database.connection import init_database; init_database()"

      - name: Re-apply migrations (must be idempotent)
        run: python -c "from src.database.connection import init_database; init_database()"

      - name: The two rows must have merged into one message in two folders
        run: |
          python - <<'PY'
          from src.database.connection import SessionLocal
          from src.models.email import EmailLog
          from src.models.placement import MessagePlacement

          with SessionLocal() as db:
              messages = db.query(EmailLog).count()
              placements = db.query(MessagePlacement).count()
              assert messages == 1, f"merge did not collapse the duplicate: {messages} rows"
              assert placements == 2, f"both placements should survive: {placements}"
          print("backfill verified")
          PY

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
