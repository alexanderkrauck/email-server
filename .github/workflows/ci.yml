name: CI

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: ruff
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/ruff-action@v3
        with:
          version: 0.14.14

  test:
    name: pytest (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt

      # The suite is self-contained: in-memory SQLite, a temporary data
      # directory, and no network. It must stay that way.
      - run: pytest -q

  migrations:
    name: alembic upgrade head
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: emailserver
          POSTGRES_USER: emailserver
          POSTGRES_PASSWORD: emailserver
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U emailserver"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      EMAILSERVER_DATABASE_URL: postgresql://emailserver:emailserver@localhost:5432/emailserver
      EMAILSERVER_DATA_DIR: /tmp/emailserver-data
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - run: pip install -r requirements.txt
      - run: mkdir -p "$EMAILSERVER_DATA_DIR"

      # Exercise the same entry point the server uses on startup, so a broken
      # revision fails here rather than on a production deployment.
      - name: Apply migrations
        run: python -c "from src.database.connection import init_database; init_database()"

      - name: Re-apply migrations (must be idempotent)
        run: python -c "from src.database.connection import init_database; init_database()"

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
