name: Release

# A tag publishes a multi-architecture image to GHCR and drafts release notes.
# Without this the quickstart is "compile psycopg2 and pull 130 MB of OCR data
# before you see anything", which is most of the reason people never get to the
# part where the software is useful.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  image:
    name: publish image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref, '-') }}

      # arm64 matters: a lot of self-hosters run this on a Raspberry Pi or an
      # Apple Silicon machine, and an amd64-only image sends them back to
      # building it themselves.
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: draft notes
    needs: image
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # docker/metadata-action strips the leading v, so the image tag is 0.1.0
      # while the git ref is v0.1.0. Using the ref here hands people a pull
      # command that fails with "manifest unknown".
      - id: version
        run: echo "number=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ```bash
            docker pull ghcr.io/${{ github.repository }}:${{ steps.version.outputs.number }}
            ```

            See [CHANGELOG.md](CHANGELOG.md) for what changed and
            [README.md](README.md#which-setup-do-i-need) for which setup you need.
